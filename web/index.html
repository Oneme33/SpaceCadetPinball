<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Play Space Cadet, the pinball table from Windows, free in your browser.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Space Cadet">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="preload" href="assets/fonts/fallback/Roboto-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <title>Play Space Cadet Pinball</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Until Flutter draws its own splash screen (lib/game/ui/splash.dart):
       the same screen in HTML, so the page never flashes white. Same font
       file (Flutter's own Roboto, made bold and italic the same way), sizes,
       spacing and bar, so the switch on Flutter's first frame is not seen. */
    @font-face {
      font-family: 'Splash Roboto';
      src: url('assets/fonts/fallback/Roboto-Regular.ttf') format('truetype');
      font-display: block;
    }
    html, body { margin: 0; height: 100%; background: #000; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
      font-family: 'Splash Roboto', sans-serif;
    }
    #boot .t { line-height: 1; font-style: italic; font-weight: 900; }
    #boot .t span {
      /* Shrink-wrapped like Flutter's Column children, with the same room
         for the italic overhang (the gradient only fills the box). */
      display: table; margin: 0 auto;
      padding: 0.1em 0.25em 0.3em 0.1em;
      color: #b8a4f0;
      /* An outline around the outer edge only, as thick as Flutter's
         (size / 22). A text stroke would draw the seams of glyph shapes. */
      filter: drop-shadow(0.045em 0 0 #2a1b5c) drop-shadow(-0.045em 0 0 #2a1b5c)
              drop-shadow(0 0.045em 0 #2a1b5c) drop-shadow(0 -0.045em 0 #2a1b5c);
      background: linear-gradient(#e6dcff, #b8a4f0, #7a5cd6);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #boot .t .b { font-size: min(84px, 100vw / 6.2); }
    #boot .t .s { font-size: min(37.8px, 100vw / 6.2 * 0.45); letter-spacing: 1px; }
    #boot .p { width: 280px; text-align: center; }
    #boot .bar {
      box-sizing: border-box; height: 22px; padding: 3px; background: #9c9c9c;
      border: 2px solid; border-color: #dcdcdc #4c4c4c #4c4c4c #dcdcdc;
    }
    #boot .bar b { display: block; box-sizing: border-box; height: 100%; padding: 2px; background: #000; }
    #boot .bar i {
      display: block; height: 100%; width: 2%;
      background: linear-gradient(#8fa2ff, #4e6cff, #2b3fb0);
      animation: boot 8s cubic-bezier(.1, .7, .3, 1) forwards;
    }
    #boot .p div { margin-top: 10px; color: #9a9ab8; font-size: 13px; letter-spacing: 0.5px; }
    @keyframes boot { to { width: 10%; } }  /* where Flutter's bar picks up */
    @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" aria-label="Loading">
    <div class="t"><span class="s">3D Pinball</span><span class="b">Space Cadet</span></div>
    <div class="p"><div class="bar"><b><i></i></b></div><div>Starting</div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- iOS: sound in a browser game. Must run before the audio engine.
       - Safari mutes Web Audio while the phone is on silent, unless the page
         declares itself a player (Audio Session API, iOS 16.4+).
       - iOS only starts audio inside a tap. The engine makes its audio
         context after loading, so every tap resumes any context that is
         still suspended. -->
  <script>
    (function () {
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';
      } catch (e) {}
      // Also on window, to check from the console.
      var contexts = window.audioContexts = [];
      ['AudioContext', 'webkitAudioContext'].forEach(function (name) {
        var Base = window[name];
        if (!Base) return;
        var Tracked = function () {
          var ctx = new (Function.prototype.bind.apply(Base, [null].concat([].slice.call(arguments))))();
          contexts.push(ctx);
          return ctx;
        };
        Tracked.prototype = Base.prototype;
        window[name] = Tracked;
      });
      function unlock() {
        contexts.forEach(function (ctx) {
          // Suspended, or interrupted by iOS (a call, another app); never closed.
          if ((ctx.state === 'suspended' || ctx.state === 'interrupted') && ctx.resume) {
            ctx.resume().catch(function () {});
          }
        });
      }
      ['touchend', 'pointerup', 'click', 'keydown'].forEach(function (type) {
        document.addEventListener(type, unlock, { capture: true, passive: true });
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) unlock();
      });
    })();
  </script>
  <!-- Audio engine (flutter_soloud): picks the right WASM build. -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
