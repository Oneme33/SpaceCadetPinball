# Apache site for space-cadet.nl, as the other sites on this server: files
# in /var/www/space-cadet.nl/www, HTTPS by certbot (which adds the
# -le-ssl.conf next to this one and the redirect below).
<VirtualHost *:80>
    ServerName space-cadet.nl
    ServerAlias www.space-cadet.nl
    DocumentRoot /var/www/space-cadet.nl/www

    <Directory /var/www/space-cadet.nl/www/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Flutter's web build: WebAssembly (Box2D, the audio engine) and
    # JavaScript modules need their types.
    AddType application/wasm .wasm
    AddType text/javascript .mjs
    AddType application/vnd.android.package-archive .apk

    # Pages and the bootstrap always fresh, so a new version shows at once;
    # the rest may be cached for a while.
    <IfModule mod_headers.c>
        <FilesMatch "(\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|config\.js)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/wasm
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/space-cadet.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/space-cadet.nl-access.log combined
</VirtualHost>
