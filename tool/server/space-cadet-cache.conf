# space-cadet.nl, installed as /etc/apache2/conf-available/space-cadet-cache.conf.
#
# Browsers check every file for a newer version on each
# visit (an unchanged file comes back as a small "304 Not Modified"), so
# a new game build or HD set reaches players at once. Without this they
# keep main.dart.js and the images for hours.
<Directory /var/www/space-cadet.nl/www>
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>

# The game (and its test copy) cross-origin isolated: only then may the
# audio engine render on its own AudioWorklet thread. Without it, sound is
# mixed on the page's main thread and ticks and crackles whenever a frame
# runs late. "credentialless" still lets the page load files from other
# sites without credentials (tool/serve_web.py does the same locally).
<DirectoryMatch "^/var/www/space-cadet\.nl/www/(play|test)/">
    <IfModule mod_headers.c>
        Header set Cross-Origin-Opener-Policy "same-origin"
        Header set Cross-Origin-Embedder-Policy "credentialless"
    </IfModule>
</DirectoryMatch>
