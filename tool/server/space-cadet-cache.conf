# space-cadet.nl: browsers check every file for a newer version on each
# visit (an unchanged file comes back as a small "304 Not Modified"), so
# a new game build or HD set reaches players at once. Without this they
# keep main.dart.js and the images for hours.
<Directory /var/www/space-cadet.nl/www>
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>
